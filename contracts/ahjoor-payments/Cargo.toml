[package]
name = "ahjoor-payments"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
ahjoor-token-whitelist = { path = "../ahjoor-token-whitelist", default-features = false }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ahjoor-token-whitelist = { path = "../ahjoor-token-whitelist", default-features = false, features = ["contract"] }
proptest = "1"
